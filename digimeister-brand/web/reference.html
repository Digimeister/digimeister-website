<!doctype html>
<html lang="en">

<title>Digimeister — logo in use (reference)</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">

<style>
/* logo classes used by the inline SVGs */
.dm-logo .ink{fill:var(--ink)} .dm-logo .pap{fill:var(--paper)} .dm-logo .paps{stroke:var(--paper)}
.dm-logo .inks{stroke:var(--ink)} .dm-logo .cab{stroke:var(--cable)} .dm-logo .cabf{fill:var(--cable)}
body{margin:0;background:var(--dm-paper);color:var(--dm-ink);font-family:var(--dm-font-text)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--dm-line);background:var(--dm-surface)}
header .wrap{display:flex;align-items:center;gap:24px;min-height:76px}
nav{margin-left:auto;display:flex;gap:28px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
nav a{color:var(--dm-ink);text-decoration:none;padding-bottom:3px;border-bottom:2px solid transparent}
nav a[aria-current="page"],nav a:hover{border-bottom-color:var(--dm-signal)}
a:focus-visible{outline:3px solid var(--dm-signal);outline-offset:3px;border-radius:2px}
.hero{padding:72px 0 80px}
.hero h1{font-family:var(--dm-font-display);font-weight:800;font-size:clamp(30px,4vw,48px);line-height:1.12;max-width:760px;margin:0 0 28px}
.btn{display:inline-block;padding:13px 20px;border-radius:var(--dm-radius-button);background:var(--dm-ink);color:var(--dm-paper);
  font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.btn.signal{background:var(--dm-signal);color:var(--dm-ink)}
.band{background:var(--dm-signal);padding:48px 0}
footer{background:var(--dm-ink);color:var(--dm-paper)}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:88px;flex-wrap:wrap}
footer small{color:var(--dm-muted-on-dark);font-size:12px}
@media (max-width:720px){nav{display:none}}
</style>
</head>

  <nav aria-label="Site"><a href="#" aria-current="page">Home</a><a href="#">About</a><a href="#">Co-dev</a><a href="#">Games</a><a href="#">Team</a></nav>
</div></header>
